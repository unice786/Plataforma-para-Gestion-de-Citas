# Base de datos MySQL local (XAMPP)
  spring.datasource.url=jdbc:mysql://localhost:3306/plataforma_citas?useSSL=false&serverTimezone=America/El_Salvador&allowPublicKeyRetrieval=true
  spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
  spring.datasource.username=root
  spring.datasource.password=${DB_PASSWORD:}

  # Configuración de JPA / Hibernate
  spring.jpa.hibernate.ddl-auto=update
  spring.jpa.show-sql=true
  spring.jpa.open-in-view=false
  # Datos para probar reservas. Define DATOS_DEMO_HABILITADO=false para omitirlos.
  app.datos-demo.habilitado=${DATOS_DEMO_HABILITADO:true}

  # Envío de correos (SMTP)
  app.correo.habilitado=${CORREO_HABILITADO:false}
  app.url=http://localhost:8080
  spring.mail.host=sandbox.smtp.mailtrap.io
  spring.mail.port=2525
  spring.mail.username=${MAIL_USERNAME:}
  spring.mail.password=${MAIL_PASSWORD:}
  spring.mail.properties.mail.smtp.auth=true
  spring.mail.properties.mail.smtp.starttls.enable=true
  spring.mail.properties.mail.smtp.connectiontimeout=10000
  spring.mail.properties.mail.smtp.timeout=10000
  spring.mail.properties.mail.smtp.writetimeout=10000
 
