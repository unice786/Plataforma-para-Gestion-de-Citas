# Perfil local: permite ejecutar el proyecto sin Docker ni MySQL instalados.
spring.datasource.url=jdbc:h2:mem:plataformadb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Evita intentos de envío de correo durante el desarrollo local.
app.correo.habilitado=false
