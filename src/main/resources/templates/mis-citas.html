<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragmentos/head :: head('Plataforma Citas - Mis citas')}"></th:block>
<body class="app-body" th:attr="data-cliente-id=${cliente.id}, data-csrf=${_csrf != null ? _csrf.token : ''}">
<th:block th:replace="~{fragmentos/decor :: decor}"></th:block>
<nav th:replace="~{fragmentos/navegacion :: navegacion}"></nav>

<main class="app-shell">
    <a class="app-back-link" th:href="@{/servicios}"><i class="bi bi-arrow-left"></i>Ir al catálogo</a>

    <header class="app-header">
        <div>
            <h1>Mis citas</h1>
            <p>Citas programadas de <span th:text="${cliente.nombre}"></span>.</p>
        </div>
        <a class="btn-pill outline" th:href="@{/mis-citas}">
            <i class="bi bi-arrow-clockwise"></i>Actualizar
        </a>
    </header>

    <div id="alertaExito" class="app-alert alert-success d-none" role="status"></div>
    <div id="alertaError" class="app-alert alert-danger d-none" role="alert"></div>

    <section class="app-card flush" th:if="${not #lists.isEmpty(citas)}">
        <div class="table-responsive">
            <table class="table-app">
                <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Servicio</th>
                    <th>Empleado</th>
                    <th>Estado</th>
                    <th class="text-end-cell">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cita : ${citas}">
                    <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(cita.hora, 'HH:mm')}"></td>
                    <td class="cell-strong" th:text="${cita.servicio.nombre}"></td>
                    <td th:text="${cita.empleado.nombre}"></td>
                    <td>
                        <span class="badge-soft" th:text="${cita.estado}"
                              th:classappend="${cita.estado.name() == 'CANCELADA'} ? ' neutral' : (${cita.estado.name() == 'COMPLETADA'} ? '' : ' info')"></span>
                    </td>
                    <td class="text-end-cell">
                        <div class="d-inline-flex gap-2">
                            <button th:if="${cita.estado.name() == 'PENDIENTE' or cita.estado.name() == 'CONFIRMADA'}"
                                    type="button" class="btn-pill small outline btn-reprogramar"
                                    th:data-cita-id="${cita.id}"
                                    th:data-servicio-id="${cita.servicio.id}"
                                    th:data-servicio="${cita.servicio.nombre}"
                                    th:data-empleado-id="${cita.empleado.id}"
                                    th:data-empleado="${cita.empleado.nombre}"
                                    th:data-fecha="${#temporals.format(cita.fecha, 'yyyy-MM-dd')}"
                                    th:data-hora="${#temporals.format(cita.hora, 'HH:mm')}">
                                <i class="bi bi-calendar-event"></i>Reprogramar
                            </button>
                            <button th:if="${cita.estado.name() == 'PENDIENTE' or cita.estado.name() == 'CONFIRMADA'}"
                                    type="button" class="btn-pill small danger-outline btn-cancelar"
                                    th:data-cita-id="${cita.id}"
                                    th:data-servicio="${cita.servicio.nombre}"
                                    th:data-fecha="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"
                                    th:data-hora="${#temporals.format(cita.hora, 'HH:mm')}">
                                <i class="bi bi-x-circle"></i>Cancelar
                            </button>
                            <button th:if="${cita.estado.name() == 'CANCELADA'}"
                                    type="button" class="btn-pill small danger-outline btn-eliminar"
                                    th:data-cita-id="${cita.id}"
                                    th:data-servicio="${cita.servicio.nombre}">
                                <i class="bi bi-trash"></i>Eliminar
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div class="app-card empty-state" th:if="${#lists.isEmpty(citas)}">
        <i class="bi bi-calendar-x"></i>
        Aún no tienes citas programadas.
    </div>
</main>

<div id="modalReprogramar" class="modal-overlay d-none">
    <div class="modal-box modal-box-wide app-card">
        <h3 style="margin:0 0 8px;font-family:'Baloo 2',sans-serif;font-weight:700;">Reprogramar cita</h3>
        <p id="reprogResumenActual" style="color:var(--auth-text-soft);margin:0 0 16px;font-size:.95rem;"></p>
        <div id="alertaReprog" class="app-alert alert-danger d-none" role="alert" style="margin-bottom:12px;"></div>
        <form id="formReprogramar">
            <div class="mb-3">
                <label class="form-label" for="nuevaFecha">Nueva fecha</label>
                <input id="nuevaFecha" class="form-control" type="date" required>
            </div>
            <div class="mb-3">
                <button type="button" class="btn-pill outline w-100" id="btnConsultarHorarios">
                    <i class="bi bi-search"></i>Ver horarios disponibles
                </button>
            </div>
            <div class="mb-3">
                <label class="form-label">Horarios disponibles</label>
                <div id="slotsReprog" class="slots-grid">
                    <p class="small mb-0" style="color:var(--auth-text-soft);">Selecciona una fecha y consulta los horarios.</p>
                </div>
            </div>
            <input type="hidden" id="reprogCitaId">
            <input type="hidden" id="reprogServicioId">
            <input type="hidden" id="reprogEmpleadoId">
            <input type="hidden" id="reprogHora">
            <div id="reprogResumenNuevo" class="resumen-cita d-none mb-3"></div>
            <div class="app-actions">
                <button type="button" class="btn-pill outline" id="reprogCerrar">Volver</button>
                <button type="submit" class="btn-pill" id="btnConfirmarReprog" disabled>
                    <i class="bi bi-calendar-check"></i>Confirmar
                </button>
            </div>
        </form>
    </div>
</div>

<div id="modalConfirmar" class="modal-overlay d-none">
    <div class="modal-box app-card">
        <h3 style="margin:0 0 8px;font-family:'Baloo 2',sans-serif;font-weight:700;" id="modalTitulo">Cancelar cita</h3>
        <p id="modalMensaje" style="color:var(--auth-text-soft);margin:0 0 20px;font-size:.95rem;"></p>
        <div class="app-actions">
            <button type="button" class="btn-pill outline" id="modalCerrar">Volver</button>
            <button type="button" class="btn-pill danger-outline" id="modalConfirmarBtn">
                <i class="bi bi-check-lg"></i><span id="modalBtnTexto">Sí, cancelar</span>
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    var body = document.body;
    var clienteId = body.getAttribute('data-cliente-id');
    var csrfToken = body.getAttribute('data-csrf') || '';
    var alertaExito = document.getElementById('alertaExito');
    var alertaError = document.getElementById('alertaError');
    var modal = document.getElementById('modalConfirmar');
    var modalTitulo = document.getElementById('modalTitulo');
    var modalMensaje = document.getElementById('modalMensaje');
    var modalBtnTexto = document.getElementById('modalBtnTexto');
    var btnCerrar = document.getElementById('modalCerrar');
    var btnConfirmar = document.getElementById('modalConfirmarBtn');
    var accionPendiente = null;

    function mostrarAlerta(el, msg) { el.textContent = msg; el.classList.remove('d-none'); }
    function ocultarAlertas() { alertaExito.classList.add('d-none'); alertaError.classList.add('d-none'); }

    var modalReprog = document.getElementById('modalReprogramar');
    var alertaReprog = document.getElementById('alertaReprog');
    var inputNuevaFecha = document.getElementById('nuevaFecha');
    var slotsReprog = document.getElementById('slotsReprog');
    var btnConsultarHorarios = document.getElementById('btnConsultarHorarios');
    var btnConfirmarReprog = document.getElementById('btnConfirmarReprog');
    var reprogResumenNuevo = document.getElementById('reprogResumenNuevo');
    var empleadoFiltroId = '';

    function hoyISO() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function mostrarAlertaReprog(msg) { alertaReprog.textContent = msg; alertaReprog.classList.remove('d-none'); }
    function ocultarAlertaReprog() { alertaReprog.classList.add('d-none'); }

    function limpiarSeleccionHorario() {
        document.getElementById('reprogHora').value = '';
        reprogResumenNuevo.classList.add('d-none');
        btnConfirmarReprog.disabled = true;
    }

    function cerrarModalReprog() {
        modalReprog.classList.add('d-none');
        limpiarSeleccionHorario();
        slotsReprog.innerHTML = '<p class="small mb-0" style="color:var(--auth-text-soft);">Selecciona una fecha y consulta los horarios.</p>';
        ocultarAlertaReprog();
    }

    document.querySelectorAll('.btn-reprogramar').forEach(function(btn) {
        btn.addEventListener('click', function() {
            ocultarAlertas();
            ocultarAlertaReprog();
            document.getElementById('reprogCitaId').value = btn.dataset.citaId;
            document.getElementById('reprogServicioId').value = btn.dataset.servicioId;
            document.getElementById('reprogEmpleadoId').value = btn.dataset.empleadoId;
            empleadoFiltroId = String(btn.dataset.empleadoId);
            inputNuevaFecha.min = hoyISO();
            inputNuevaFecha.value = btn.dataset.fecha && btn.dataset.fecha >= hoyISO() ? btn.dataset.fecha : hoyISO();
            document.getElementById('reprogResumenActual').textContent =
                '"' + btn.dataset.servicio + '" con ' + btn.dataset.empleado + ' · ' + btn.dataset.fecha + ' a las ' + btn.dataset.hora + '. Elige un nuevo horario.';
            limpiarSeleccionHorario();
            slotsReprog.innerHTML = '<p class="small mb-0" style="color:var(--auth-text-soft);">Selecciona una fecha y consulta los horarios.</p>';
            modalReprog.classList.remove('d-none');
        });
    });

    btnConsultarHorarios.addEventListener('click', function() {
        ocultarAlertaReprog();
        limpiarSeleccionHorario();
        var servicioId = document.getElementById('reprogServicioId').value;
        if (!inputNuevaFecha.value) {
            mostrarAlertaReprog('Selecciona una fecha para consultar los horarios.');
            return;
        }
        slotsReprog.innerHTML = '<p style="color:var(--auth-text-soft);">Consultando disponibilidad...</p>';
        fetch('/api/citas/disponibilidad?servicioId=' + servicioId + '&fecha=' + inputNuevaFecha.value)
            .then(function(r) { return r.json(); })
            .then(function(slots) {
                var filtrados = (slots || []).filter(function(s) {
                    return String(s.empleadoId) === empleadoFiltroId;
                });
                if (!filtrados.length) {
                    slotsReprog.innerHTML = '<p style="color:var(--auth-text-soft);">No hay horarios disponibles para esa fecha. Prueba con otro día.</p>';
                    return;
                }
                slotsReprog.innerHTML = '';
                filtrados.forEach(function(s) {
                    var boton = document.createElement('button');
                    boton.type = 'button';
                    boton.className = 'slot';
                    boton.innerHTML = '<span class="slot-hora">' + String(s.horaInicio).substring(0, 5) + '</span>' +
                        '<span class="slot-emp">' + s.empleadoNombre + '</span>';
                    boton.addEventListener('click', function() {
                        slotsReprog.querySelectorAll('.slot').forEach(function(x) { x.classList.remove('activo'); });
                        boton.classList.add('activo');
                        document.getElementById('reprogHora').value = s.horaInicio;
                        reprogResumenNuevo.innerHTML = 'Nueva fecha: <strong>' + inputNuevaFecha.value +
                            '</strong> · Hora: <strong>' + String(s.horaInicio).substring(0, 5) + '</strong>';
                        reprogResumenNuevo.classList.remove('d-none');
                        btnConfirmarReprog.disabled = false;
                    });
                    slotsReprog.appendChild(boton);
                });
            })
            .catch(function() {
                slotsReprog.innerHTML = '';
                mostrarAlertaReprog('No se pudo consultar la disponibilidad. Intenta de nuevo.');
            });
    });

    document.getElementById('reprogCerrar').addEventListener('click', cerrarModalReprog);
    modalReprog.addEventListener('click', function(e) { if (e.target === modalReprog) cerrarModalReprog(); });

    document.getElementById('formReprogramar').addEventListener('submit', function(evento) {
        evento.preventDefault();
        ocultarAlertaReprog();
        var citaId = document.getElementById('reprogCitaId').value;
        var hora = document.getElementById('reprogHora').value;
        if (!inputNuevaFecha.value || !hora) {
            mostrarAlertaReprog('Selecciona fecha y horario antes de confirmar.');
            return;
        }
        btnConfirmarReprog.disabled = true;
        fetch('/api/citas/reprogramar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-TOKEN': csrfToken
            },
            body: JSON.stringify({
                citaId: Number(citaId),
                clienteId: Number(clienteId),
                fecha: inputNuevaFecha.value,
                hora: hora
            })
        })
        .then(function(r) {
            return r.json().then(function(datos) { return { ok: r.ok, datos: datos }; });
        })
        .then(function(resultado) {
            if (!resultado.ok) {
                mostrarAlertaReprog(resultado.datos && resultado.datos.mensaje ? resultado.datos.mensaje : 'No se pudo reprogramar la cita.');
                btnConfirmarReprog.disabled = false;
                return;
            }
            cerrarModalReprog();
            mostrarAlerta(alertaExito, resultado.datos.mensaje || 'Cita reprogramada correctamente.');
            setTimeout(function() { location.reload(); }, 1500);
        })
        .catch(function() {
            mostrarAlertaReprog('Error de conexión al reprogramar. Intenta de nuevo.');
            btnConfirmarReprog.disabled = false;
        });
    });

    document.querySelectorAll('.btn-cancelar').forEach(function(btn) {
        btn.addEventListener('click', function() {
            ocultarAlertas();
            accionPendiente = { tipo: 'cancelar', id: btn.dataset.citaId };
            modalTitulo.textContent = 'Cancelar cita';
            modalMensaje.textContent = '¿Seguro que quieres cancelar tu cita de "' + btn.dataset.servicio + '" el ' + btn.dataset.fecha + ' a las ' + btn.dataset.hora + '?';
            modalBtnTexto.textContent = 'Sí, cancelar';
            modal.classList.remove('d-none');
        });
    });

    document.querySelectorAll('.btn-eliminar').forEach(function(btn) {
        btn.addEventListener('click', function() {
            ocultarAlertas();
            accionPendiente = { tipo: 'eliminar', id: btn.dataset.citaId };
            modalTitulo.textContent = 'Eliminar del historial';
            modalMensaje.textContent = '¿Seguro que quieres eliminar la cita de "' + btn.dataset.servicio + '" de tu historial? Esta acción no se puede deshacer.';
            modalBtnTexto.textContent = 'Sí, eliminar';
            modal.classList.remove('d-none');
        });
    });

    btnCerrar.addEventListener('click', function() { modal.classList.add('d-none'); accionPendiente = null; });
    modal.addEventListener('click', function(e) { if (e.target === modal) { modal.classList.add('d-none'); accionPendiente = null; } });

    btnConfirmar.addEventListener('click', function() {
        if (!accionPendiente) return;
        btnConfirmar.disabled = true;
        var url = '/api/citas/' + accionPendiente.id + (accionPendiente.tipo === 'eliminar' ? '/eliminar' : '/cancelar') + '?clienteId=' + clienteId;
        fetch(url, {
            method: 'DELETE',
            headers: { 'X-CSRF-TOKEN': csrfToken }
        })
        .then(function(r) {
            if (r.ok) return r.text().then(function() { return { ok: true }; });
            return r.json().then(function(d) { return { ok: false, data: d }; });
        })
        .then(function(res) {
            modal.classList.add('d-none');
            btnConfirmar.disabled = false;
            accionPendiente = null;
            if (res.ok) {
                mostrarAlerta(alertaExito, res.data && res.data.mensaje ? res.data.mensaje : (accionPendiente && accionPendiente.tipo === 'eliminar' ? 'Cita eliminada del historial.' : 'Cita cancelada correctamente.'));
                setTimeout(function() { location.reload(); }, 1500);
            } else {
                mostrarAlerta(alertaError, res.data && res.data.mensaje ? res.data.mensaje : 'No se pudo completar la acción.');
            }
        })
        .catch(function() {
            modal.classList.add('d-none');
            btnConfirmar.disabled = false;
            accionPendiente = null;
            mostrarAlerta(alertaError, 'Error de conexión. Intenta de nuevo.');
        });
    });
})();
</script>

<th:block th:replace="~{fragmentos/theme-script :: themeScript}"></th:block>
</body>
</html>
