<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Citas - Mis citas</title>
    <script>
        (function(){
            var saved = localStorage.getItem('auth-theme');
            if(saved){ document.documentElement.setAttribute('data-theme', saved); }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app-body"
      th:attr="data-csrf=${_csrf != null ? _csrf.token : ''}, data-csrf-name=${_csrf != null ? _csrf.parameterName : '_csrf'}">

<div class="auth-decor">
    <svg class="decor-top" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg">
        <path d="M260,0 C180,60 220,140 120,190 C40,230 70,300 0,360" stroke-opacity="0.9"/>
        <path d="M274,0 C194,58 234,142 134,196 C50,238 82,308 10,372" stroke-opacity="0.75" transform="translate(10,-4)"/>
        <path d="M288,0 C208,56 248,144 148,202 C60,246 94,316 20,384" stroke-opacity="0.6" transform="translate(20,-8)"/>
        <path d="M302,0 C222,54 262,146 162,208 C70,254 106,324 30,396" stroke-opacity="0.45" transform="translate(30,-12)"/>
        <path d="M316,0 C236,52 276,148 176,214 C80,262 118,332 40,408" stroke-opacity="0.3" transform="translate(40,-16)"/>
        <path d="M330,0 C250,50 290,150 190,220 C90,270 130,340 50,420" stroke-opacity="0.18" transform="translate(50,-20)"/>
    </svg>
    <svg class="decor-bottom" viewBox="0 0 900 380" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,260 C90,190 140,320 230,270 C320,220 360,340 460,300 C560,260 590,150 690,190 C760,220 800,130 900,160" stroke-opacity="0.85"/>
        <path d="M0,284 C90,214 140,336 230,290 C320,244 360,356 460,320 C560,284 590,178 690,214 C760,242 800,158 900,186" stroke-opacity="0.6"/>
        <path d="M0,308 C90,238 140,352 230,310 C320,268 360,372 460,340 C560,308 590,206 690,238 C760,264 800,186 900,212" stroke-opacity="0.35"/>
    </svg>
    <span class="auth-dot dot-1"></span>
    <span class="auth-dot dot-2"></span>
    <span class="auth-dot dot-3"></span>
    <span class="auth-dot dot-4"></span>
    <span class="auth-dot dot-5"></span>
    <span class="auth-dot dot-6"></span>
</div>

<button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema">
    <i class="bi bi-sun-fill" id="themeIcon"></i>
</button>

<nav th:replace="~{fragmentos/navegacion :: navegacion}"></nav>

<main class="app-shell">
    <a class="app-back-link" th:href="@{/servicios}"><i class="bi bi-arrow-left"></i>Ir al catálogo</a>

    <header class="app-header">
        <div>
            <h1>Mis citas</h1>
            <p>Citas programadas de <span th:text="${cliente.nombre}"></span>.</p>
        </div>
        <button class="btn-pill outline" id="btnActualizarCitas" type="button">
            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
            <span>Actualizar</span>
        </button>
    </header>

    <div class="app-alert alert-success" role="status" th:if="${exito}" th:text="${exito}"></div>
    <div class="app-alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

    <div class="app-card loading-state" id="citasLoading" role="status" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span>Cargando tus citas...</span>
    </div>

    <section class="app-card flush" id="citasContenido" aria-busy="true" hidden>
        <div class="table-responsive">
            <table class="table-app">
                <caption class="visually-hidden">Listado de citas del cliente</caption>
                <thead>
                <tr>
                    <th scope="col">Fecha</th>
                    <th scope="col">Hora</th>
                    <th scope="col">Servicio</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Acciones</th>
                </tr>
                </thead>
                <tbody id="citasTablaBody"></tbody>
            </table>
        </div>
    </section>

    <div class="app-card empty-state" id="citasVacio" role="status" hidden>
        <i class="bi bi-calendar-x" aria-hidden="true"></i>
        <strong>Aún no tienes citas registradas.</strong>
        <span>Cuando reserves una cita, aparecerá en esta sección.</span>
    </div>

    <div class="app-card empty-state error-state" id="citasError" role="alert" hidden>
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <strong>No pudimos cargar tus citas.</strong>
        <span>Verifica tu conexión e inténtalo nuevamente.</span>
        <button class="btn-pill outline small" id="btnReintentarCitas" type="button">Reintentar</button>
    </div>
</main>

<script th:src="@{/js/mis-citas.js(v='2')}" defer></script>
<script>
    (function(){
        var htmlEl = document.documentElement;
        var toggle = document.getElementById('themeToggle');
        var icon = document.getElementById('themeIcon');
        function applyIcon(){
            icon.className = htmlEl.getAttribute('data-theme') === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
        }
        applyIcon();
        toggle.addEventListener('click', function(){
            var next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('auth-theme', next);
            applyIcon();
        });
    })();
</script>
</body>
</html>
