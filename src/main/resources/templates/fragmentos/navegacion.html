<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fragmento de navegacion</title>
</head>
<body>
<nav class="app-nav" th:fragment="navegacion">
    <div class="app-nav-inner">
        <a class="app-nav-brand" th:href="@{/inicio}">
            Plataforma de Citas
        </a>
        <div class="app-nav-links">
            <a th:href="@{/inicio}"><i class="bi bi-house-door"></i>Inicio</a>

            <th:block th:if="${session.usuario != null and session.usuario.rol.name() == 'CLIENTE'}">
                <a th:href="@{/servicios}"><i class="bi bi-spa"></i>Servicios</a>
                <a th:href="@{/reservar}"><i class="bi bi-calendar-plus"></i>Reservar</a>
                <a th:href="@{/mis-citas}"><i class="bi bi-calendar-check"></i>Mis citas</a>
            </th:block>

            <th:block th:if="${session.usuario != null and session.usuario.rol.name() == 'ADMINISTRADOR'}">
                <a th:href="@{/servicios}"><i class="bi bi-spa"></i>Servicios</a>
                <a th:href="@{/admin/servicios}"><i class="bi bi-gear"></i>Administraci&oacute;n</a>
                <a th:href="@{/admin/categorias}"><i class="bi bi-tags"></i>Categor&iacute;as</a>
                <a th:href="@{/admin/citas}"><i class="bi bi-calendar2-check"></i>Citas</a>
                <a th:href="@{/admin/horarios}"><i class="bi bi-clock"></i>Horarios</a>
            </th:block>

            <th:block th:if="${session.usuario != null and session.usuario.rol.name() == 'EMPLEADO'}">
                <a th:href="@{/empleado/citas}"><i class="bi bi-calendar-check"></i>Mis citas</a>
            </th:block>
        </div>
        <div class="app-nav-user">
            <div class="notif-wrapper" th:if="${session.usuario != null}">
                <button type="button" class="notif-bell" id="notifBell" aria-label="Notificaciones">
                    <i class="bi bi-bell"></i>
                    <span class="notif-badge d-none" id="notifBadge">0</span>
                </button>
                <div class="notif-panel d-none" id="notifPanel">
                    <div class="notif-header">
                        <strong>Notificaciones</strong>
                        <button type="button" class="notif-close" id="notifClose"><i class="bi bi-x-lg"></i></button>
                    </div>
                    <div class="notif-list" id="notifList">
                        <p class="notif-empty">No hay notificaciones.</p>
                    </div>
                </div>
            </div>
            <span><i class="bi bi-person-circle me-1"></i><th:block th:if="${session.usuario != null}" th:text="${session.usuario.nombre}"></th:block></span>
            <a th:href="@{/logout}" title="Cerrar sesion"><i class="bi bi-box-arrow-right"></i></a>
            <button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema">
                <i class="bi bi-sun-fill" id="themeIcon"></i>
            </button>
        </div>
    </div>
    <script th:if="${session.usuario != null}" th:inline="javascript">
(function() {
    var usuarioId = [[${session.usuario.id}]];
    var bell = document.getElementById('notifBell');
    var badge = document.getElementById('notifBadge');
    var panel = document.getElementById('notifPanel');
    var list = document.getElementById('notifList');
    var closeBtn = document.getElementById('notifClose');

    function cargarNotificaciones() {
        fetch('/api/notificaciones/' + usuarioId + '/conteo')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.noLeidas > 0) {
                    badge.textContent = d.noLeidas;
                    badge.classList.remove('d-none');
                } else {
                    badge.classList.add('d-none');
                }
            });
    }

    bell.addEventListener('click', function() {
        panel.classList.toggle('d-none');
        if (!panel.classList.contains('d-none')) {
            fetch('/api/notificaciones/' + usuarioId)
                .then(function(r) { return r.json(); })
                .then(function(notifs) {
                    if (!notifs.length) {
                        list.innerHTML = '<p class="notif-empty">No hay notificaciones.</p>';
                        return;
                    }
                    list.innerHTML = '';
                    notifs.forEach(function(n) {
                        var div = document.createElement('div');
                        div.className = 'notif-item' + (n.leida ? '' : ' unread');
                        div.innerHTML = '<span class="notif-icon"><i class="bi bi-bell-fill"></i></span>' +
                            '<div class="notif-body"><p>' + n.mensaje + '</p>' +
                            '<small>' + n.tipo + '</small></div>';
                        if (!n.leida) {
                            div.addEventListener('click', function() {
                                fetch('/api/notificaciones/' + n.id + '/leer', { method: 'PUT' })
                                    .then(function() { div.classList.remove('unread'); cargarNotificaciones(); });
                            });
                        }
                        list.appendChild(div);
                    });
                });
        }
    });

    closeBtn.addEventListener('click', function() { panel.classList.add('d-none'); });
    document.addEventListener('click', function(e) {
        if (!bell.contains(e.target) && !panel.contains(e.target)) panel.classList.add('d-none');
    });

    cargarNotificaciones();
    setInterval(cargarNotificaciones, 30000);
})();
</script>
</nav>
</body>
</html>
