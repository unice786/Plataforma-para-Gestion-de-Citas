<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fragmento de navegacion</title>
</head>
<body>
<nav class="app-nav" th:fragment="navegacion">
    <div class="app-nav-inner">
        <a class="app-nav-brand" th:href="@{/inicio}">
            <i class="bi bi-heart-fill"></i>Plataforma de Citas
        </a>
        <div class="app-nav-links">
            <a th:href="@{/inicio}"><i class="bi bi-house-door"></i>Inicio</a>

            <th:block th:if="${session.usuario != null and session.usuario.rol.name() == 'CLIENTE'}">
                <a th:href="@{/servicios}"><i class="bi bi-spa"></i>Servicios</a>
                <a th:href="@{/reservar}"><i class="bi bi-calendar-plus"></i>Reservar</a>
                <a th:href="@{/mis-citas}"><i class="bi bi-calendar-check"></i>Mis citas</a>
            </th:block>

            <th:block th:if="${session.usuario != null and session.usuario.rol.name() == 'ADMINISTRADOR'}">
                <a th:href="@{/servicios}"><i class="bi bi-spa"></i>Servicios</a>
                <a th:href="@{/admin/servicios}"><i class="bi bi-gear"></i>Administraci&oacute;n</a>
                <a th:href="@{/admin/citas}"><i class="bi bi-calendar2-check"></i>Citas</a>
                <a th:href="@{/admin/horarios}"><i class="bi bi-clock"></i>Horarios</a>
            </th:block>

            <th:block th:if="${session.usuario != null and session.usuario.rol.name() == 'EMPLEADO'}">
                <a th:href="@{/mis-citas}"><i class="bi bi-calendar-check"></i>Mis citas</a>
            </th:block>
        </div>
        <div class="app-nav-user">
            <span><i class="bi bi-person-circle me-1"></i><th:block th:if="${session.usuario != null}" th:text="${session.usuario.nombre}"></th:block></span>
            <a th:href="@{/logout}" title="Cerrar sesion"><i class="bi bi-box-arrow-right"></i></a>
            <button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema">
                <i class="bi bi-sun-fill" id="themeIcon"></i>
            </button>
        </div>
    </div>
</nav>
</body>
</html>
