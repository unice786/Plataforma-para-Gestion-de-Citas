<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="text-center mb-5">
        <h1>Servicios disponibles</h1>
        <p class="text-muted">Elige el servicio que mejor se adapte a ti.</p>
    </div>

    <div class="row g-4" th:if="${not #lists.isEmpty(servicios)}">
        <div class="col-md-6 col-lg-4" th:each="servicio : ${servicios}">
            <article class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <span class="text-primary small mb-2" th:text="${servicio.categoria.nombre}"></span>
                    <h2 class="h5" th:text="${servicio.nombre}"></h2>
                    <p class="text-muted flex-grow-1" th:text="${servicio.descripcion}"></p>
                    <div class="d-flex justify-content-between border-top pt-3">
                        <strong th:text="${#numbers.formatDecimal(servicio.precio, 1, 2)}"></strong>
                        <span><span th:text="${servicio.duracionMinutos}"></span> min</span>
                    </div>
                </div>
            </article>
        </div>
    </div>
    <p class="text-center text-muted" th:if="${#lists.isEmpty(servicios)}">No hay servicios disponibles por el momento.</p>
</main>
</body>
</html>
