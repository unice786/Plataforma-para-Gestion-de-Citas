<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Citas - Servicios</title>
    <script>(function(){var saved=localStorage.getItem('auth-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);})();</script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-body service-body">
<div class="auth-decor" aria-hidden="true"><svg class="decor-top" viewBox="0 0 440 440"><path d="M260,0 C180,60 220,140 120,190 C40,230 70,300 0,360"/><path d="M288,0 C208,56 248,144 148,202 C60,246 94,316 20,384" stroke-opacity=".55"/></svg><svg class="decor-bottom" viewBox="0 0 900 380" preserveAspectRatio="none"><path d="M0,260 C90,190 140,320 230,270 C320,220 360,340 460,300 C560,260 590,150 690,190 C760,220 800,130 900,160"/><path d="M0,308 C90,238 140,352 230,310 C320,268 360,372 460,340 C560,308 590,206 690,238 C760,264 800,186 900,212" stroke-opacity=".4"/></svg><span class="auth-dot dot-1"></span><span class="auth-dot dot-2"></span><span class="auth-dot dot-3"></span><span class="auth-dot dot-4"></span><span class="auth-dot dot-5"></span></div>
<button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema"><i class="bi bi-sun-fill" id="themeIcon"></i></button>
<main class="service-page">
    <nav class="service-nav"><a class="service-brand" th:href="@{/servicios}"><i class="bi bi-heart-fill"></i> Plataforma de Citas</a><div class="service-nav-links"><a th:href="@{/login}">Iniciar sesión</a><a class="service-nav-cta" th:href="@{/registro}">Crear cuenta</a></div></nav>
    <header class="service-hero"><span class="service-eyebrow"><i class="bi bi-calendar2-check"></i> Agenda tu bienestar</span><h1>Encuentra el servicio<br>perfecto para ti.</h1><p>Explora nuestros servicios disponibles y elige el que mejor se adapte a tus necesidades.</p></header>
    <section class="service-grid" th:if="${not #lists.isEmpty(servicios)}" aria-label="Servicios disponibles"><article class="service-item" th:each="servicio : ${servicios}"><div class="service-item-icon"><i class="bi bi-stars"></i></div><span class="service-category" th:text="${servicio.categoria.nombre}"></span><h2 th:text="${servicio.nombre}"></h2><p th:text="${servicio.descripcion}"></p><div class="service-meta"><span><i class="bi bi-clock"></i> <span th:text="${servicio.duracionMinutos}"></span> min</span><strong>$<span th:text="${#numbers.formatDecimal(servicio.precio, 1, 2)}"></span></strong></div></article></section>
    <section class="service-empty" th:if="${#lists.isEmpty(servicios)}"><div><i class="bi bi-calendar-x"></i></div><h2>Aún no hay servicios disponibles</h2><p>Muy pronto encontrarás opciones para reservar tu cita.</p></section>
</main>
<script>(function(){var html=document.documentElement,toggle=document.getElementById('themeToggle'),icon=document.getElementById('themeIcon');function render(){icon.className=html.getAttribute('data-theme')==='dark'?'bi bi-moon-stars-fill':'bi bi-sun-fill';}render();toggle.addEventListener('click',function(){html.setAttribute('data-theme',html.getAttribute('data-theme')==='dark'?'light':'dark');localStorage.setItem('auth-theme',html.getAttribute('data-theme'));render();});})();</script>
</body></html>
