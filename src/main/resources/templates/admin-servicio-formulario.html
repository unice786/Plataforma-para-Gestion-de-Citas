<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${servicio.id == null ? 'Nuevo servicio' : 'Editar servicio'}">Plataforma Citas - Servicio</title>
    <script>
        (function(){
            var saved = localStorage.getItem('auth-theme');
            if(saved){ document.documentElement.setAttribute('data-theme', saved); }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app-body">

<div class="auth-decor">
    <svg class="decor-top" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg">
        <path d="M260,0 C180,60 220,140 120,190 C40,230 70,300 0,360" stroke-opacity="0.9"/>
        <path d="M274,0 C194,58 234,142 134,196 C50,238 82,308 10,372" stroke-opacity="0.75" transform="translate(10,-4)"/>
        <path d="M288,0 C208,56 248,144 148,202 C60,246 94,316 20,384" stroke-opacity="0.6" transform="translate(20,-8)"/>
        <path d="M302,0 C222,54 262,146 162,208 C70,254 106,324 30,396" stroke-opacity="0.45" transform="translate(30,-12)"/>
        <path d="M316,0 C236,52 276,148 176,214 C80,262 118,332 40,408" stroke-opacity="0.3" transform="translate(40,-16)"/>
        <path d="M330,0 C250,50 290,150 190,220 C90,270 130,340 50,420" stroke-opacity="0.18" transform="translate(50,-20)"/>
    </svg>
    <svg class="decor-bottom" viewBox="0 0 900 380" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,260 C90,190 140,320 230,270 C320,220 360,340 460,300 C560,260 590,150 690,190 C760,220 800,130 900,160" stroke-opacity="0.85"/>
        <path d="M0,284 C90,214 140,336 230,290 C320,244 360,356 460,320 C560,284 590,178 690,214 C760,242 800,158 900,186" stroke-opacity="0.6"/>
        <path d="M0,308 C90,238 140,352 230,310 C320,268 360,372 460,340 C560,308 590,206 690,238 C760,264 800,186 900,212" stroke-opacity="0.35"/>
    </svg>
    <span class="auth-dot dot-1"></span>
    <span class="auth-dot dot-2"></span>
    <span class="auth-dot dot-3"></span>
    <span class="auth-dot dot-4"></span>
    <span class="auth-dot dot-5"></span>
    <span class="auth-dot dot-6"></span>
</div>

<nav th:replace="~{fragmentos/navegacion :: navegacion}"></nav>

<main class="app-shell narrow">
    <a class="app-back-link" th:href="@{/admin/servicios}"><i class="bi bi-arrow-left"></i>Volver al listado</a>

    <header class="app-header">
        <h1 th:text="${servicio.id == null ? 'Nuevo servicio' : 'Editar servicio'}"></h1>
    </header>

    <div class="app-alert alert-warning" role="alert" th:if="${#lists.isEmpty(categorias)}">
        No hay categorías registradas. Debes crear al menos una categoría antes de guardar un servicio.
    </div>

    <form class="app-card" th:object="${servicio}"
          th:action="${servicio.id == null} ? @{/admin/servicios} : @{/admin/servicios/{id}/editar(id=${servicio.id})}"
          method="post">
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input id="nombre" class="form-control" type="text" th:field="*{nombre}" maxlength="100" required>
            <div class="invalid-feedback d-block" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="categoria">Categoría</label>
            <select id="categoria" class="form-select" th:field="*{categoria.id}" required>
                <option value="">Selecciona una categoría</option>
                <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nombre}"></option>
            </select>
            <div class="invalid-feedback d-block" th:errors="*{categoria}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="descripcion">Descripción</label>
            <textarea id="descripcion" class="form-control" th:field="*{descripcion}" maxlength="1000" rows="4"></textarea>
            <div class="invalid-feedback d-block" th:errors="*{descripcion}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="precio">Precio ($)</label>
                <input id="precio" class="form-control" type="number" th:field="*{precio}" min="0.01" step="0.01" required>
                <div class="invalid-feedback d-block" th:errors="*{precio}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="duracion">Duración (minutos)</label>
                <input id="duracion" class="form-control" type="number" th:field="*{duracionMinutos}" min="1" required>
                <div class="invalid-feedback d-block" th:errors="*{duracionMinutos}"></div>
            </div>
        </div>

        <div class="app-actions">
            <a class="btn-pill outline" th:href="@{/admin/servicios}">Cancelar</a>
            <button class="btn-pill" type="submit" th:disabled="${#lists.isEmpty(categorias)}">Guardar servicio</button>
        </div>
    </form>
</main>

<script>
    (function(){
        var htmlEl = document.documentElement;
        var toggle = document.getElementById('themeToggle');
        var icon = document.getElementById('themeIcon');
        function applyIcon(){
            icon.className = htmlEl.getAttribute('data-theme') === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
        }
        applyIcon();
        toggle.addEventListener('click', function(){
            var next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('auth-theme', next);
            applyIcon();
        });
    })();
</script>
</body>
</html>
