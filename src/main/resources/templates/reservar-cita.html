<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragmentos/head :: head('Plataforma Citas - Reservar cita')}"></th:block>
<body class="app-body"
      th:attr="data-cliente-id=${clienteId}, data-csrf=${_csrf != null ? _csrf.token : ''}, data-servicio-id=${servicioPreseleccionado != null ? servicioPreseleccionado : ''}">
<th:block th:replace="~{fragmentos/decor :: decor}"></th:block>
<nav th:replace="~{fragmentos/navegacion :: navegacion}"></nav>

<main class="app-shell narrow">
    <header class="app-header">
        <div>
            <h1>Reservar una cita</h1>
            <p>Hola <span th:text="${clienteNombre}"></span>, elige servicio, fecha y horario.</p>
        </div>
    </header>

    <div id="alertaExito" class="app-alert alert-success d-none" role="status"></div>
    <div id="alertaError" class="app-alert alert-danger d-none" role="alert"></div>

    <form class="app-card" id="formReserva">
        <div class="mb-3">
            <label class="form-label" for="servicio">Servicio</label>
            <select id="servicio" class="form-select" required>
                <option value="">Cargando servicios...</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="fecha">Fecha</label>
                <input id="fecha" class="form-control" type="date" required>
            </div>
            <div class="col-md-6 mb-3 d-flex align-items-end">
                <button type="button" class="btn-pill outline w-100" id="btnConsultar">
                    <i class="bi bi-search"></i>Ver horarios disponibles
                </button>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Horarios disponibles</label>
            <div id="slots" class="slots-grid">
                <p class="text-secondary-emphasis small mb-0" style="color:var(--auth-text-soft);">
                    Selecciona un servicio y una fecha para ver los horarios.
                </p>
            </div>
        </div>

        <input type="hidden" id="empleadoId" required>
        <input type="hidden" id="hora" required>

        <div id="resumen" class="resumen-cita d-none mb-3"></div>

        <div class="app-actions">
            <a class="btn-pill outline" th:href="@{/servicios}">Cancelar</a>
            <button class="btn-pill" type="submit" id="btnReservar" disabled>
                <i class="bi bi-calendar-check"></i>Confirmar reserva
            </button>
        </div>
    </form>
</main>

<script th:inline="javascript" th:src="@{/js/reserva.js}"></script>
<th:block th:replace="~{fragmentos/theme-script :: themeScript}"></th:block>
</body>
</html>
