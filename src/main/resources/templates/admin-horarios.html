<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragmentos/head :: head('Plataforma Citas - Administrar horarios')}"></th:block>
<body class="app-body">
<th:block th:replace="~{fragmentos/decor :: decor}"></th:block>
<nav th:replace="~{fragmentos/navegacion :: navegacion}"></nav>

<main class="app-shell">
    <header class="app-header">
        <div>
            <h1>Administración de horarios</h1>
            <p>Crea, edita o elimina bloques de disponibilidad.</p>
        </div>
        <a class="btn-pill" th:href="@{/admin/horarios/nuevo}">
            <i class="bi bi-plus-lg"></i>Nuevo horario
        </a>
    </header>

    <div class="app-alert alert-success" role="status" th:if="${exito}" th:text="${exito}"></div>
    <div class="app-alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

    <section class="app-card flush" th:if="${not #lists.isEmpty(horarios)}">
        <div class="table-responsive">
            <table class="table-app">
                <thead>
                <tr>
                    <th>Empleado</th>
                    <th>Fecha</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Estado</th>
                    <th class="text-end-cell">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="horario : ${horarios}">
                    <td>
                        <span class="cell-strong" th:text="${horario.empleadoNombre}"></span>
                    </td>
                    <td th:text="${horario.fecha}"></td>
                    <td th:text="${horario.horaInicio}"></td>
                    <td th:text="${horario.horaFin}"></td>
                    <td>
                        <span class="badge-soft" th:text="${horario.estado}"></span>
                    </td>
                    <td class="text-end-cell">
                        <div class="d-inline-flex gap-2">
                            <a class="btn-pill outline small" th:href="@{/admin/horarios/{id}/editar(id=${horario.id})}">
                                <i class="bi bi-pencil-square"></i>Editar
                            </a>
                            <form class="d-inline"
                                  th:action="@{/admin/horarios/{id}/eliminar(id=${horario.id})}" method="post">
                                <button class="btn-pill danger-outline small" type="submit"
                                        onclick="return confirm('¿Quieres eliminar este horario?');">
                                    <i class="bi bi-trash3"></i>Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div class="app-card empty-state" th:if="${#lists.isEmpty(horarios)}">
        <i class="bi bi-inbox"></i>
        Todavía no hay horarios registrados.
    </div>
</main>

<th:block th:replace="~{fragmentos/theme-script :: themeScript}"></th:block>
</body>
</html>
