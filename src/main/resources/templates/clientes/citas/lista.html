<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 mb-1">Mis citas</h1>
            <p class="text-muted mb-0" th:text="|Citas programadas de ${cliente.nombre}.|"></p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/clientes/{clienteId}/citas(clienteId=${cliente.id})}">Actualizar</a>
    </div>

    <div class="card shadow-sm" th:if="${not #lists.isEmpty(citas)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Fecha</th>
                    <th scope="col">Hora</th>
                    <th scope="col">Servicio</th>
                    <th scope="col">Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cita : ${citas}">
                    <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(cita.hora, 'HH:mm')}"></td>
                    <td th:text="${cita.servicio.nombre}"></td>
                    <td>
                        <span class="badge text-bg-secondary" th:text="${cita.estado}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="alert alert-info" role="status" th:if="${#lists.isEmpty(citas)}">
        Aún no tienes citas programadas.
    </div>
</main>
</body>
</html>
