<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Citas - Registro</title>
    <script>
        (function(){
            var saved = localStorage.getItem('auth-theme');
            if(saved){ document.documentElement.setAttribute('data-theme', saved); }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .registro-card {
            max-width: 680px;
            width: 100%;
        }
        .auth-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 576px) {
            .auth-row-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="auth-body">

    <button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>

    <div class="auth-page">
        <div class="auth-container" style="justify-content:center;">
            <div class="auth-card registro-card">
                <h1 class="brand-title">Crear Cuenta</h1>
                <p class="brand-subtitle">Regístrate en Plataforma de Citas</p>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/registro}" th:object="${cliente}" method="post">
                    <div class="auth-row-2">
                        <div class="input-icon-group">
                            <i class="bi bi-person input-icon"></i>
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Nombre completo">
                            <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-danger small"></div>
                        </div>
                        <div class="input-icon-group">
                            <i class="bi bi-envelope input-icon"></i>
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" id="correo" th:field="*{correo}" class="form-control" placeholder="Correo electrónico">
                            <div th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}" class="text-danger small"></div>
                        </div>
                    </div>
                    <div class="auth-row-2">
                        <div class="input-icon-group">
                            <i class="bi bi-telephone input-icon"></i>
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text" id="telefono" th:field="*{telefono}" class="form-control" placeholder="Teléfono">
                            <div th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="text-danger small"></div>
                        </div>
                        <div class="input-icon-group">
                            <i class="bi bi-lock input-icon"></i>
                            <label for="contrasena" class="form-label">Contraseña</label>
                            <input type="password" id="contrasena" th:field="*{contrasena}" class="form-control" placeholder="Contraseña (mín. 8 caracteres)">
                            <div th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}" class="text-danger small"></div>
                        </div>
                    </div>
                    <div class="input-icon-group">
                        <i class="bi bi-lock-fill input-icon"></i>
                        <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
                        <input type="password" id="confirmarPassword" name="confirmarPassword" class="form-control" placeholder="Confirmar contraseña">
                    </div>

                    <button type="submit" class="btn-auth-submit">Registrarse</button>
                </form>

                <p class="auth-switch">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script>
        (function(){
            var htmlEl = document.documentElement;
            var toggle = document.getElementById('themeToggle');
            var icon = document.getElementById('themeIcon');
            function applyIcon(){
                icon.className = htmlEl.getAttribute('data-theme') === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
            }
            applyIcon();
            toggle.addEventListener('click', function(){
                var next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                htmlEl.setAttribute('data-theme', next);
                localStorage.setItem('auth-theme', next);
                applyIcon();
            });
        })();
    </script>
</body>
</html>
