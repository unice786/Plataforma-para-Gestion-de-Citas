<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow-sm" style="width: 100%; max-width: 420px;">
    <h3 class="text-center mb-3">Crear Cuenta</h3>

    <div th:if="${param.exito}" class="alert alert-success">
        ¡Registro exitoso! Tu cuenta ha sido guardada.
    </div>

    <form th:action="@{/registro}" th:object="${cliente}" method="post">
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej. Ana López">
        </div>
        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" th:field="*{correo}" class="form-control" required placeholder="correo@ejemplo.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" th:field="*{telefono}" class="form-control" required placeholder="0991234567">
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" th:field="*{contrasena}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>
</div>
</body>
</html>
