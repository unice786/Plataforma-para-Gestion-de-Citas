<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragmentos/head :: head('Citas programadas')}"></th:block>
<body class="app-body">
<th:block th:replace="~{fragmentos/decor :: decor}"></th:block>
<nav th:replace="~{fragmentos/navegacion :: navegacion}"></nav>

<main class="app-shell">
    <header class="app-header">
        <div>
            <span class="service-eyebrow"><i class="bi bi-shield-check"></i> Administración</span>
            <h1>Citas programadas</h1>
            <p>Consulta y filtra las citas registradas para llevar el control de la agenda.</p>
        </div>
        <span class="appointment-count"><i class="bi bi-calendar3"></i> <span th:text="${#lists.size(citas)}"></span> citas</span>
    </header>

    <div class="app-alert alert-success" th:if="${exito}"><i class="bi bi-check-circle"></i><span th:text="${exito}"></span></div>
    <div class="app-alert alert-danger" th:if="${error}"><i class="bi bi-exclamation-circle"></i><span th:text="${error}"></span></div>

    <form class="appointment-filters" method="get" th:action="@{/admin/citas}">
        <div>
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" th:value="${fecha}">
        </div>
        <div>
            <label for="cliente">Cliente</label>
            <input id="cliente" name="cliente" type="search" placeholder="Buscar por nombre" th:value="${cliente}">
        </div>
        <button type="submit"><i class="bi bi-search"></i> Buscar</button>
        <a th:href="@{/admin/citas}"><i class="bi bi-arrow-counterclockwise"></i> Limpiar</a>
    </form>

    <section class="app-card flush" th:if="${not #lists.isEmpty(citas)}">
        <div class="table-responsive">
            <table class="table-app">
                <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Servicio</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cita : ${citas}">
                    <td>
                        <span class="cell-strong" th:text="${cita.cliente.nombre}"></span>
                        <small class="cell-muted" th:text="${cita.cliente.correo}"></small>
                    </td>
                    <td th:text="${cita.servicio.nombre}"></td>
                    <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(cita.hora, 'HH:mm')}"></td>
                    <td><span class="badge-soft" th:text="${cita.estado}"></span></td>
                    <td>
                        <div class="d-inline-flex gap-2">
                            <a class="btn-pill outline small" th:if="${cita.estado.name() != 'CANCELADA'}" th:href="@{/admin/citas/{id}/editar(id=${cita.id})}" aria-label="Modificar cita"><i class="bi bi-pencil-square"></i> Editar</a>
                            <form class="d-inline" th:if="${cita.estado.name() != 'CANCELADA'}" th:action="@{/admin/citas/{id}/cancelar(id=${cita.id})}" method="post">
                                <button class="btn-pill danger-outline small" type="submit" onclick="return confirm('¿Deseas cancelar esta cita?');"><i class="bi bi-x-circle"></i> Cancelar</button>
                            </form>
                        </div>
                        <small th:if="${cita.detalleUltimoCambio}" th:text="${cita.detalleUltimoCambio}"></small>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div class="app-card empty-state" th:if="${#lists.isEmpty(citas)}">
        <i class="bi bi-calendar-x"></i>
        <h2>No se encontraron citas</h2>
        <p>No hay citas que coincidan con los filtros seleccionados.</p>
        <a class="btn-pill" th:href="@{/admin/citas}"><i class="bi bi-arrow-counterclockwise"></i> Ver todas las citas</a>
    </div>
</main>

<th:block th:replace="~{fragmentos/theme-script :: themeScript}"></th:block>
</body>
</html>
