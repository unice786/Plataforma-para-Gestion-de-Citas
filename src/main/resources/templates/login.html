<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Citas - Iniciar Sesión</title>
    <script>
        (function(){
            var saved = localStorage.getItem('auth-theme');
            if(saved){ document.documentElement.setAttribute('data-theme', saved); }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .login-card {
            max-width: 520px;
            width: 100%;
        }
    </style>
</head>
<body class="auth-body">

    <button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>

    <div class="auth-page">
        <div class="auth-container" style="justify-content:center;">
            <div class="auth-card login-card">
                <h1 class="brand-title">Iniciar Sesión</h1>
                <p class="brand-subtitle">Ingresa a tu cuenta de Plataforma de Citas</p>

                <div th:if="${param.verificado}" class="alert alert-success">
                    ¡Cuenta verificada! Ya puedes iniciar sesión.
                </div>
                <div th:if="${param.recuperada}" class="alert alert-success">
                    ¡Contraseña actualizada! Ya puedes iniciar sesión.
                </div>
                <div th:if="${param['error-verificacion']}" class="alert alert-danger">
                    El enlace de verificación no es válido o expiró.
                </div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/login}" method="post">
                    <div class="input-icon-group">
                        <i class="bi bi-person input-icon"></i>
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" class="form-control" required placeholder="Correo electrónico">
                    </div>
                    <div class="input-icon-group">
                        <i class="bi bi-lock input-icon"></i>
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" required placeholder="Contraseña">
                    </div>

                    <div class="auth-row-options">
                        <label class="auth-remember">
                            <input type="checkbox" name="remember-me">
                            Recuérdame
                        </label>
                        <a th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-auth-submit">Ingresar</button>
                </form>

                <p class="auth-switch">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
            </div>
        </div>
    </div>

    <script>
        (function(){
            var htmlEl = document.documentElement;
            var toggle = document.getElementById('themeToggle');
            var icon = document.getElementById('themeIcon');
            function applyIcon(){
                icon.className = htmlEl.getAttribute('data-theme') === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
            }
            applyIcon();
            toggle.addEventListener('click', function(){
                var next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                htmlEl.setAttribute('data-theme', next);
                localStorage.setItem('auth-theme', next);
                applyIcon();
            });
        })();
    </script>
</body>
</html>
