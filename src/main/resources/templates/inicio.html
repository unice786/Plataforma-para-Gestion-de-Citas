<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Citas - Inicio</title>
    <script>
        (function(){
            var saved = localStorage.getItem('auth-theme');
            if(saved){ document.documentElement.setAttribute('data-theme', saved); }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-body">

<!-- Decoración de fondo (líneas + puntos) -->
<div class="auth-decor">
    <svg class="decor-top" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg">
        <path d="M260,0 C180,60 220,140 120,190 C40,230 70,300 0,360" stroke-opacity="0.9"/>
        <path d="M274,0 C194,58 234,142 134,196 C50,238 82,308 10,372" stroke-opacity="0.75" transform="translate(10,-4)"/>
        <path d="M288,0 C208,56 248,144 148,202 C60,246 94,316 20,384" stroke-opacity="0.6" transform="translate(20,-8)"/>
        <path d="M302,0 C222,54 262,146 162,208 C70,254 106,324 30,396" stroke-opacity="0.45" transform="translate(30,-12)"/>
        <path d="M316,0 C236,52 276,148 176,214 C80,262 118,332 40,408" stroke-opacity="0.3" transform="translate(40,-16)"/>
        <path d="M330,0 C250,50 290,150 190,220 C90,270 130,340 50,420" stroke-opacity="0.18" transform="translate(50,-20)"/>
    </svg>
    <svg class="decor-bottom" viewBox="0 0 900 380" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,260 C90,190 140,320 230,270 C320,220 360,340 460,300 C560,260 590,150 690,190 C760,220 800,130 900,160" stroke-opacity="0.85"/>
        <path d="M0,284 C90,214 140,336 230,290 C320,244 360,356 460,320 C560,284 590,178 690,214 C760,242 800,158 900,186" stroke-opacity="0.6"/>
        <path d="M0,308 C90,238 140,352 230,310 C320,268 360,372 460,340 C560,308 590,206 690,238 C760,264 800,186 900,212" stroke-opacity="0.35"/>
    </svg>
    <span class="auth-dot dot-1"></span>
    <span class="auth-dot dot-2"></span>
    <span class="auth-dot dot-3"></span>
    <span class="auth-dot dot-4"></span>
    <span class="auth-dot dot-5"></span>
    <span class="auth-dot dot-6"></span>
</div>

<nav th:replace="~{fragmentos/navegacion :: navegacion}"></nav>

<div class="auth-page">
    <div class="auth-container" style="flex-direction:column;justify-content:flex-start;gap:24px;max-width:760px;">

        <div class="auth-card" style="flex:none;width:100%;">
            <div th:if="${param.bienvenido}" class="alert alert-success">
                ¡Registro exitoso! Bienvenido/a, <strong th:text="${usuario.nombre}"></strong>.
            </div>

            <h2 class="brand-title" style="font-size:1.5rem;margin-bottom:6px;">Bienvenido a la Plataforma de Citas</h2>
            <p class="brand-subtitle" th:text="'Tu cuenta: ' + ${usuario.correo}"></p>

            <p style="color:var(--auth-text-soft);margin:0 0 4px;">¿Qué quieres hacer hoy?</p>
            <div class="quick-grid">
                <a class="quick-card" th:href="@{/reservar}">
                    <i class="bi bi-calendar-plus"></i>
                    <strong>Reservar cita</strong>
                    <span style="color:var(--auth-text-soft);font-size:.85rem;">Agenda en línea</span>
                </a>
                <a class="quick-card" th:href="@{/servicios}">
                    <i class="bi bi-spa"></i>
                    <strong>Servicios</strong>
                    <span style="color:var(--auth-text-soft);font-size:.85rem;">Explora el catálogo</span>
                </a>
                <a class="quick-card" th:href="@{/mis-citas}">
                    <i class="bi bi-calendar-check"></i>
                    <strong>Mis citas</strong>
                    <span style="color:var(--auth-text-soft);font-size:.85rem;">Revisa tus reservas</span>
                </a>
                <a class="quick-card" th:href="@{/admin/servicios}">
                    <i class="bi bi-gear"></i>
                    <strong>Administración</strong>
                    <span style="color:var(--auth-text-soft);font-size:.85rem;">Gestiona servicios</span>
                </a>
            </div>
        </div>

    </div>
</div>

<script>
    (function(){
        var htmlEl = document.documentElement;
        var toggle = document.getElementById('themeToggle');
        var icon = document.getElementById('themeIcon');
        function applyIcon(){
            icon.className = htmlEl.getAttribute('data-theme') === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
        }
        applyIcon();
        toggle.addEventListener('click', function(){
            var next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('auth-theme', next);
            applyIcon();
        });
    })();
</script>
</body>
</html>
