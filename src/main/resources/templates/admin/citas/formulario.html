<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar cita</title>
    <script>(function(){var saved=localStorage.getItem('auth-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);})();</script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-body service-body">
<div class="auth-decor" aria-hidden="true"><svg class="decor-top" viewBox="0 0 440 440"><path d="M260,0 C180,60 220,140 120,190 C40,230 70,300 0,360"/></svg><svg class="decor-bottom" viewBox="0 0 900 380" preserveAspectRatio="none"><path d="M0,260 C90,190 140,320 230,270 C320,220 360,340 460,300 C560,260 590,150 690,190 C760,220 800,130 900,160"/></svg></div>
<button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema"><i class="bi bi-sun-fill" id="themeIcon"></i></button>
<main class="service-page admin-page">
    <nav class="service-nav"><a class="service-brand" th:href="@{/admin/citas}"><i class="bi bi-calendar2-check-fill"></i> Plataforma de Citas</a><a class="service-nav-back" th:href="@{/admin/citas}"><i class="bi bi-arrow-left"></i> Volver a citas</a></nav>
    <section class="service-form-shell">
        <header><span class="service-eyebrow"><i class="bi bi-pencil-square"></i> AdministraciÃ³n</span><h1>Modificar cita</h1><p>Actualiza la fecha, hora o servicio solicitado por <strong th:text="${cita.cliente.nombre}"></strong>.</p></header>
        <form class="service-form" th:object="${edicionCita}" th:action="@{/admin/citas/{id}/editar(id=${cita.id})}" method="post">
            <div class="service-alert danger service-form-field full" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
            <div class="service-form-field"><label for="fecha">Fecha</label><div><i class="bi bi-calendar-event"></i><input id="fecha" name="fecha" type="date" th:value="${edicionCita.fecha == null ? '' : #temporals.format(edicionCita.fecha, 'yyyy-MM-dd')}" required></div><small th:errors="*{fecha}"></small></div>
            <div class="service-form-field"><label for="hora">Hora</label><div><i class="bi bi-clock"></i><input id="hora" name="hora" type="time" th:value="${edicionCita.hora == null ? '' : #temporals.format(edicionCita.hora, 'HH:mm')}" required></div><small th:errors="*{hora}"></small></div>
            <div class="service-form-field full"><label for="servicio">Servicio</label><div><i class="bi bi-briefcase"></i><select id="servicio" th:field="*{servicioId}" required><option value="">Selecciona un servicio</option><option th:each="servicio : ${servicios}" th:value="${servicio.id}" th:text="|${servicio.nombre} (${servicio.duracionMinutos} min)|"></option></select></div><small th:errors="*{servicioId}"></small></div>
            <footer><a th:href="@{/admin/citas}">Cancelar edición</a><button type="submit"><i class="bi bi-check-lg"></i> Guardar cambios</button></footer>
        </form>
    </section>
</main>
<script>(function(){var html=document.documentElement,toggle=document.getElementById('themeToggle'),icon=document.getElementById('themeIcon');function render(){icon.className=html.getAttribute('data-theme')==='dark'?'bi bi-moon-stars-fill':'bi bi-sun-fill';}render();toggle.addEventListener('click',function(){html.setAttribute('data-theme',html.getAttribute('data-theme')==='dark'?'light':'dark');localStorage.setItem('auth-theme',html.getAttribute('data-theme'));render();});})();</script>
</body>
</html>
