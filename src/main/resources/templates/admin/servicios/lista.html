<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Administrar servicios</title><script>(function(){var saved=localStorage.getItem('auth-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);})();</script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="auth-body service-body"><div class="auth-decor" aria-hidden="true"><svg class="decor-top" viewBox="0 0 440 440"><path d="M260,0 C180,60 220,140 120,190 C40,230 70,300 0,360"/></svg><svg class="decor-bottom" viewBox="0 0 900 380" preserveAspectRatio="none"><path d="M0,260 C90,190 140,320 230,270 C320,220 360,340 460,300 C560,260 590,150 690,190 C760,220 800,130 900,160"/></svg><span class="auth-dot dot-1"></span><span class="auth-dot dot-3"></span><span class="auth-dot dot-4"></span></div><button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema"><i class="bi bi-sun-fill" id="themeIcon"></i></button>
<main class="service-page admin-page"><nav class="service-nav"><a class="service-brand" th:href="@{/admin/servicios}"><i class="bi bi-heart-fill"></i> Plataforma de Citas</a><a class="service-nav-back" th:href="@{/servicios}"><i class="bi bi-grid"></i> Ver catálogo</a></nav><header class="admin-heading"><div><span class="service-eyebrow"><i class="bi bi-shield-check"></i> Administración</span><h1>Servicios</h1><p>Gestiona los servicios que estarán disponibles en el catálogo público.</p></div><a class="service-primary-action" th:href="@{/admin/servicios/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo servicio</a></header>
    <div class="service-alert success" th:if="${exito}"><i class="bi bi-check-circle"></i><span th:text="${exito}"></span></div><div class="service-alert danger" th:if="${error}"><i class="bi bi-exclamation-circle"></i><span th:text="${error}"></span></div>
    <section class="admin-list-card" th:if="${not #lists.isEmpty(servicios)}"><article class="admin-service-row" th:each="servicio : ${servicios}"><div class="service-item-icon"><i class="bi bi-stars"></i></div><div class="admin-service-details"><span class="service-category" th:text="${servicio.categoria.nombre}"></span><h2 th:text="${servicio.nombre}"></h2><p th:text="${servicio.descripcion}"></p></div><div class="admin-service-stat"><span>Precio</span><strong>$<span th:text="${#numbers.formatDecimal(servicio.precio, 1, 2)}"></span></strong></div><div class="admin-service-stat"><span>Duración</span><strong><span th:text="${servicio.duracionMinutos}"></span> min</strong></div><span class="service-status" th:classappend="${servicio.activo} ? ' active' : ' inactive'" th:text="${servicio.activo} ? 'Activo' : 'Retirado'"></span><div class="admin-service-actions"><a th:href="@{/admin/servicios/{id}/editar(id=${servicio.id})}" aria-label="Editar servicio"><i class="bi bi-pencil-square"></i></a><form th:if="${servicio.activo}" th:action="@{/admin/servicios/{id}/eliminar(id=${servicio.id})}" method="post"><button type="submit" aria-label="Retirar servicio" onclick="return confirm('¿Quieres retirar este servicio del catálogo?');"><i class="bi bi-trash3"></i></button></form></div></article></section>
    <section class="service-empty" th:if="${#lists.isEmpty(servicios)}"><div><i class="bi bi-clipboard2-x"></i></div><h2>Tu catálogo está vacío</h2><p>Crea el primer servicio para que tus clientes puedan verlo.</p><a class="service-primary-action" th:href="@{/admin/servicios/nuevo}"><i class="bi bi-plus-lg"></i> Crear servicio</a></section>
</main><script>(function(){var html=document.documentElement,toggle=document.getElementById('themeToggle'),icon=document.getElementById('themeIcon');function render(){icon.className=html.getAttribute('data-theme')==='dark'?'bi bi-moon-stars-fill':'bi bi-sun-fill';}render();toggle.addEventListener('click',function(){html.setAttribute('data-theme',html.getAttribute('data-theme')==='dark'?'light':'dark');localStorage.setItem('auth-theme',html.getAttribute('data-theme'));render();});})();</script></body></html>
