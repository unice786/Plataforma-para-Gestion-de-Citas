<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrar servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Administración de servicios</h1>
            <p class="text-muted mb-0">Crea, edita o retira servicios del catálogo.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/servicios/nuevo}">Nuevo servicio</a>
    </div>

    <div class="alert alert-success" role="alert" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Duración</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="servicio : ${servicios}">
                    <td>
                        <strong th:text="${servicio.nombre}"></strong>
                        <small class="d-block text-muted" th:text="${servicio.descripcion}"></small>
                    </td>
                    <td th:text="${servicio.categoria.nombre}"></td>
                    <td th:text="${#numbers.formatDecimal(servicio.precio, 1, 2)}"></td>
                    <td><span th:text="${servicio.duracionMinutos}"></span> min</td>
                    <td>
                        <span class="badge text-bg-success" th:if="${servicio.activo}">Activo</span>
                        <span class="badge text-bg-secondary" th:unless="${servicio.activo}">Retirado</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/servicios/{id}/editar(id=${servicio.id})}">Editar</a>
                        <form class="d-inline" th:if="${servicio.activo}"
                              th:action="@{/admin/servicios/{id}/eliminar(id=${servicio.id})}" method="post">
                            <button class="btn btn-outline-danger btn-sm" type="submit"
                                    onclick="return confirm('¿Quieres retirar este servicio del catálogo?');">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(servicios)}">
                    <td class="text-center text-muted py-4" colspan="6">Todavía no hay servicios registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
