<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Citas - Administrar servicios</title>
    <script>
        (function(){
            var saved = localStorage.getItem('auth-theme');
            if(saved){ document.documentElement.setAttribute('data-theme', saved); }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app-body">

<div class="auth-decor">
    <svg class="decor-top" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg">
        <path d="M260,0 C180,60 220,140 120,190 C40,230 70,300 0,360" stroke-opacity="0.9"/>
        <path d="M274,0 C194,58 234,142 134,196 C50,238 82,308 10,372" stroke-opacity="0.75" transform="translate(10,-4)"/>
        <path d="M288,0 C208,56 248,144 148,202 C60,246 94,316 20,384" stroke-opacity="0.6" transform="translate(20,-8)"/>
        <path d="M302,0 C222,54 262,146 162,208 C70,254 106,324 30,396" stroke-opacity="0.45" transform="translate(30,-12)"/>
        <path d="M316,0 C236,52 276,148 176,214 C80,262 118,332 40,408" stroke-opacity="0.3" transform="translate(40,-16)"/>
        <path d="M330,0 C250,50 290,150 190,220 C90,270 130,340 50,420" stroke-opacity="0.18" transform="translate(50,-20)"/>
    </svg>
    <svg class="decor-bottom" viewBox="0 0 900 380" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,260 C90,190 140,320 230,270 C320,220 360,340 460,300 C560,260 590,150 690,190 C760,220 800,130 900,160" stroke-opacity="0.85"/>
        <path d="M0,284 C90,214 140,336 230,290 C320,244 360,356 460,320 C560,284 590,178 690,214 C760,242 800,158 900,186" stroke-opacity="0.6"/>
        <path d="M0,308 C90,238 140,352 230,310 C320,268 360,372 460,340 C560,308 590,206 690,238 C760,264 800,186 900,212" stroke-opacity="0.35"/>
    </svg>
    <span class="auth-dot dot-1"></span>
    <span class="auth-dot dot-2"></span>
    <span class="auth-dot dot-3"></span>
    <span class="auth-dot dot-4"></span>
    <span class="auth-dot dot-5"></span>
    <span class="auth-dot dot-6"></span>
</div>

<button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema">
    <i class="bi bi-sun-fill" id="themeIcon"></i>
</button>

<main class="app-shell">
    <header class="app-header">
        <div>
            <h1>Administración de servicios</h1>
            <p>Crea, edita o retira servicios del catálogo.</p>
        </div>
        <a class="btn-pill" th:href="@{/admin/servicios/nuevo}">
            <i class="bi bi-plus-lg"></i>Nuevo servicio
        </a>
    </header>

    <div class="app-alert alert-success" role="status" th:if="${exito}" th:text="${exito}"></div>
    <div class="app-alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

    <section class="app-card flush" th:if="${not #lists.isEmpty(servicios)}">
        <div class="table-responsive">
            <table class="table-app">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Duración</th>
                    <th>Estado</th>
                    <th class="text-end-cell">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="servicio : ${servicios}">
                    <td>
                        <span class="cell-strong" th:text="${servicio.nombre}"></span>
                        <small class="cell-muted" th:text="${servicio.descripcion}"></small>
                    </td>
                    <td th:text="${servicio.categoria.nombre}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(servicio.precio, 1, 2)}"></td>
                    <td><span th:text="${servicio.duracionMinutos}"></span> min</td>
                    <td>
                        <span class="badge-soft" th:if="${servicio.activo}">Activo</span>
                        <span class="badge-soft neutral" th:unless="${servicio.activo}">Retirado</span>
                    </td>
                    <td class="text-end-cell">
                        <div class="d-inline-flex gap-2">
                            <a class="btn-pill outline small" th:href="@{/admin/servicios/{id}/editar(id=${servicio.id})}">
                                <i class="bi bi-pencil-square"></i>Editar
                            </a>
                            <form class="d-inline" th:if="${servicio.activo}"
                                  th:action="@{/admin/servicios/{id}/eliminar(id=${servicio.id})}" method="post">
                                <button class="btn-pill danger-outline small" type="submit"
                                        onclick="return confirm('¿Quieres retirar este servicio del catálogo?');">
                                    <i class="bi bi-trash3"></i>Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div class="app-card empty-state" th:if="${#lists.isEmpty(servicios)}">
        <i class="bi bi-inbox"></i>
        Todavía no hay servicios registrados.
    </div>
</main>

<script>
    (function(){
        var htmlEl = document.documentElement;
        var toggle = document.getElementById('themeToggle');
        var icon = document.getElementById('themeIcon');
        function applyIcon(){
            icon.className = htmlEl.getAttribute('data-theme') === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
        }
        applyIcon();
        toggle.addEventListener('click', function(){
            var next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('auth-theme', next);
            applyIcon();
        });
    })();
</script>
</body>
</html>
