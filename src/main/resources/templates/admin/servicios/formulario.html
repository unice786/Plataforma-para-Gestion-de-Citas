<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${servicio.id == null ? 'Nuevo servicio' : 'Editar servicio'}">Servicio</title><script>(function(){var saved=localStorage.getItem('auth-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);})();</script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="auth-body service-body"><div class="auth-decor" aria-hidden="true"><svg class="decor-top" viewBox="0 0 440 440"><path d="M260,0 C180,60 220,140 120,190 C40,230 70,300 0,360"/></svg><svg class="decor-bottom" viewBox="0 0 900 380" preserveAspectRatio="none"><path d="M0,260 C90,190 140,320 230,270 C320,220 360,340 460,300 C560,260 590,150 690,190 C760,220 800,130 900,160"/></svg><span class="auth-dot dot-2"></span><span class="auth-dot dot-4"></span></div><button type="button" class="auth-theme-toggle" id="themeToggle" aria-label="Cambiar tema"><i class="bi bi-sun-fill" id="themeIcon"></i></button>
<main class="service-page admin-page"><nav class="service-nav"><a class="service-brand" th:href="@{/admin/servicios}"><i class="bi bi-heart-fill"></i> Plataforma de Citas</a><a class="service-nav-back" th:href="@{/admin/servicios}"><i class="bi bi-arrow-left"></i> Volver a servicios</a></nav><section class="service-form-shell"><header><span class="service-eyebrow"><i class="bi bi-pencil-square"></i> Administración</span><h1 th:text="${servicio.id == null ? 'Crear servicio' : 'Editar servicio'}"></h1><p th:text="${servicio.id == null ? 'Completa los datos para añadirlo al catálogo.' : 'Actualiza la información que verán tus clientes.'}"></p></header><div class="service-alert warning" th:if="${#lists.isEmpty(categorias)}"><i class="bi bi-info-circle"></i> No hay categorías registradas. Debes crear una antes de guardar un servicio.</div>
        <form class="service-form" th:object="${servicio}" th:action="${servicio.id == null} ? @{/admin/servicios} : @{/admin/servicios/{id}/editar(id=${servicio.id})}" method="post"><div class="service-form-field full"><label for="nombre">Nombre del servicio</label><div><i class="bi bi-briefcase"></i><input id="nombre" type="text" th:field="*{nombre}" maxlength="100" placeholder="Ej. Consulta general" required></div><small th:errors="*{nombre}"></small></div><div class="service-form-field full"><label for="categoria">Categoría</label><div><i class="bi bi-tags"></i><select id="categoria" th:field="*{categoria.id}" required><option value="">Selecciona una categoría</option><option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nombre}"></option></select></div><small th:errors="*{categoria}"></small></div><div class="service-form-field full"><label for="descripcion">Descripción</label><div><i class="bi bi-card-text"></i><textarea id="descripcion" th:field="*{descripcion}" maxlength="1000" rows="4" placeholder="Describe brevemente este servicio"></textarea></div><small th:errors="*{descripcion}"></small></div><div class="service-form-field"><label for="precio">Precio</label><div><i class="bi bi-currency-dollar"></i><input id="precio" type="number" th:field="*{precio}" min="0.01" step="0.01" placeholder="0.00" required></div><small th:errors="*{precio}"></small></div><div class="service-form-field"><label for="duracion">Duración en minutos</label><div><i class="bi bi-clock"></i><input id="duracion" type="number" th:field="*{duracionMinutos}" min="1" placeholder="60" required></div><small th:errors="*{duracionMinutos}"></small></div><footer><a th:href="@{/admin/servicios}">Cancelar</a><button type="submit" th:disabled="${#lists.isEmpty(categorias)}"><i class="bi bi-check-lg"></i> Guardar servicio</button></footer></form>
    </section></main><script>(function(){var html=document.documentElement,toggle=document.getElementById('themeToggle'),icon=document.getElementById('themeIcon');function render(){icon.className=html.getAttribute('data-theme')==='dark'?'bi bi-moon-stars-fill':'bi bi-sun-fill';}render();toggle.addEventListener('click',function(){html.setAttribute('data-theme',html.getAttribute('data-theme')==='dark'?'light':'dark');localStorage.setItem('auth-theme',html.getAttribute('data-theme'));render();});})();</script></body></html>
